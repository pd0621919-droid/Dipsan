<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beast Anime Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>⚡ Beast Anime Studio</h1>
<p>BEASTBOUND: DIMENSION ZERO</p>
</header>

<main>
<section class="card">
<h2>🎬 Generate Scene</h2>

<label>Scene prompt</label>
<textarea id="prompt">Original anime-inspired cinematic scene, a mysterious young hero stands in an ancient ruined forest at night. A gigantic dimensional portal opens behind him, glowing Beast energy surrounds his body, wind and debris swirl through the air, strange ancient symbols illuminate the ground, his eyes briefly glow with unknown power, and a huge mysterious shadow moves inside the portal. Dynamic camera movement, dramatic cinematic lighting, intense energy particles, powerful atmosphere, highly detailed original animation, mysterious cliffhanger feeling. Original characters and original world, no existing anime characters.</textarea>

<div class="row">
<div>
<label>Duration</label>
<select id="duration">
<option>5</option>
<option>8</option>
<option>12</option>
<option>16</option>
</select>
</div>

<div>
<label>Format</label>
<select id="ratio">
<option>16:9</option>
<option>9:16</option>
<option>1:1</option>
</select>
</div>
</div>

<button id="generate">🔥 Generate Video</button>
<div id="status"></div>
</section>

<section class="card">
<h2>⚙️ Backend</h2>
<input id="api" value="https://dipsan.onrender.com">
<button id="save">Save Backend URL</button>
</section>
</main>

<script src="app.js"></script>
</body>
</html>
