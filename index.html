<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beast Anime Studio</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <h1>🔥 Beast Anime Studio</h1>
    <p>Create your Beastbound anime scenes.</p>

    <label>Scene Prompt</label>
    <textarea id="prompt" rows="7">BEASTBOUND: DIMENSION ZERO — cinematic anime scene. A mysterious child stands before a massive dimensional rift. Storm energy, glowing symbols, powerful Beast aura, dramatic lighting, cinematic camera movement, intense VFX, original anime world.</textarea>

    <label>Duration</label>
    <select id="duration">
      <option value="5">5 seconds</option>
      <option value="8">8 seconds</option>
      <option value="12">12 seconds</option>
      <option value="16">16 seconds</option>
    </select>

    <label>Aspect Ratio</label>
    <select id="ratio">
      <option value="16:9">16:9 — Long Video</option>
      <option value="9:16">9:16 — Shorts</option>
      <option value="1:1">1:1 — Square</option>
    </select>

    <button id="generate">🔥 Generate Video</button>

    <div id="status"></div>

    <label>Backend URL</label>
    <input id="api" value="https://dipsan.onrender.com">

    <button id="save">Save Backend URL</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
